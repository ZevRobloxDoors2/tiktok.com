<!DOCTYPE html>
<html lang="en-us">
  <head>
    <script>
        // Patch postMessage for cross-origin environments
        (function() {
            const originalPostMessage = window.parent.postMessage;
            try {
                if (window.parent && window.parent.postMessage) {
                    window.parent.postMessage = function(message, targetOrigin) {
                        if (targetOrigin && targetOrigin !== '*' && !targetOrigin.includes(window.location.origin)) {
                            return originalPostMessage.call(window.parent, message, '*');
                        }
                        return originalPostMessage.apply(window.parent, arguments);
                    };
                }
            } catch (e) {
                console.warn("Could not patch parent.postMessage", e);
            }
        })();

        window.ytgame = {
            game: {
                loadData: () => {
                    return new Promise((resolve) => {
                        const requestId = Math.random().toString(36).substr(2, 9);
                        const handleResponse = (event) => {
                            if (event.data && event.data.type === 'LOAD_GAME_DATA_RESPONSE' && event.data.requestId === requestId) {
                                window.removeEventListener('message', handleResponse);
                                resolve(event.data.data);
                            }
                        };
                        window.addEventListener('message', handleResponse);
                        window.parent.postMessage({
                            type: 'LOAD_GAME_DATA',
                            gameId: 'miside',
                            requestId
                        }, '*');
                    });
                },
                saveData: (data) => {
                    window.parent.postMessage({
                        type: 'SAVE_GAME_DATA',
                        gameId: 'miside',
                        data
                    }, '*');
                    return Promise.resolve();
                },
                firstClick: () => {},
                gameReady: () => {},
                firstFrameReady: () => {}
            },
            health: { logError: () => {} },
            engagement: { score: () => {} },
            system: { isPaused: () => false }
        };
    </script>

    <base href="https://cdn.jsdelivr.net/gh/web-ports/miside@main/">

  <body>
    <div id="loading-text"
    style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING...
  </div>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>

          <div id="unity-progress-bar-full"></div>

    <script>

var loadingText = document.querySelector("#loading-text");
    let totalBytes = 0;
    let loadedBytes = 0;

    async function fetchWithProgress(url) {
      const response = await fetch(url);
      const reader = response.body.getReader();
      let chunks = [];
      let received = 0;
      while (true) {
        const {
          done,
          value
        } = await reader.read();
        if (done) break;
        received += value.length;
        loadedBytes += value.length;
        chunks.push(value);
        let mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
        let mbTotal = '130.91';
        loadingText.textContent = `LOADING... ${mbDone} MB / ${mbTotal} MB`;
      }
      let fullBuffer = new Uint8Array(received);
      let offset = 0;
      for (let chunk of chunks) {
        fullBuffer.set(chunk, offset);
        offset += chunk.length;
      }
      return fullBuffer.buffer;
    }

    async function mergeFiles(fileParts, cacheKey) {
      const cache = await caches.open("gash-cache");
      const cachedResponse = await cache.match(cacheKey);
      if (cachedResponse) {
        const blob = await cachedResponse.blob();
        return URL.createObjectURL(blob);
      }
      const buffers = await Promise.all(
        fileParts.map(part => fetchWithProgress(part))
      );
      const mergedBlob = new Blob(buffers);
      const response = new Response(mergedBlob);
      await cache.put(cacheKey, response);
      return URL.createObjectURL(mergedBlob);
    }

    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) {
        parts.push(file + ".part" + i);
      }
      return parts;
    }
    (async () => {
      const [dataUrl, wasmUrl] = await Promise.all([
        mergeFiles(getParts("Build/MiSide.data", 1, 6), "MiSide.data"),
        mergeFiles(getParts("Build/MiSide.wasm", 1, 2), "MiSide.wasm"),
      ]);
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {

      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/MiSide.loader.js";
      var config = {
        dataUrl: dataUrl,
        frameworkUrl: "Build/MiSide.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "AIHASTO",
        productName: "MiSide",
        productVersion: "1.13",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          loadingText.remove();
          alert("the loading in game will take a while, dont worry it will only happen on the first time you play.")
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    })();
    </script>
