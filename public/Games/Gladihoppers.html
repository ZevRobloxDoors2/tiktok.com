  <script>
    window.alert = function() {};
    window.confirm = function() {
      return false;
    };
    window.prompt = function() {
      return null;
    };
    window.fileMergerConfig = {
      files: [{
          name: 'Gladihoppers.data.unityweb',
          parts: 2
        },

          name: 'Gladihoppers.wasm.code.unityweb',

  <script src="https://cdn.jsdelivr.net/gh/FunkyTimmy/UGS-Assets@main/merge.js"></script>
  <script>
    window.config = {
      loader: 'unity',
      debug: false,
      maxRatio: 16 / 9,
      minRatio: 9 / 16,
      title: 'Gladihoppers',
      thumbnail: 'patch/png/null.png',
      numScreenshots: 5,
      unityVersion: '2019.3.13f1',
      unityWebglBuildUrl: 'Build/Gladihoppers.json',
      fileSize: 23,
      cachedDecompressedFileSizes: {

        'Gladihoppers.wasm.code.unityweb': 6410659,
        'Gladihoppers.wasm.framework.unityweb': 91463,
      },
    };

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
      }
    });
  </script>
