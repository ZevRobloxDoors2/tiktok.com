name: Deploy static content to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Restore cached Shorts feed
        uses: actions/cache@v4
        with:
          path: public/youtube-feed.json
          key: youtube-feed-${{ github.run_id }}
          restore-keys: |
            youtube-feed-
      - name: Build
        env:
          YOUTUBE_API_KEY_1: ${{ secrets.YOUTUBE_API_KEY_1 }}
          YOUTUBE_API_KEY_2: ${{ secrets.YOUTUBE_API_KEY_2 }}
          YOUTUBE_API_KEY_3: ${{ secrets.YOUTUBE_API_KEY_3 }}
          YOUTUBE_API_KEY_4: ${{ secrets.YOUTUBE_API_KEY_4 }}
          YOUTUBE_API_KEY_5: ${{ secrets.YOUTUBE_API_KEY_5 }}
        run: |
          test -n "$YOUTUBE_API_KEY_1" || test -n "$YOUTUBE_API_KEY_2" || test -n "$YOUTUBE_API_KEY_3" || test -n "$YOUTUBE_API_KEY_4" || test -n "$YOUTUBE_API_KEY_5"
          node scripts/fetch-youtube-feed.mjs
          npx vite build
      - name: Verify Pages artifact
        run: test -s dist/index.html && test -d dist/assets
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
